<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skibidi Shop — Premium Tech Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050505;
      --surface: #111;
      --surface-2: #1a1a1a;
      --border: #222;
      --text: #fff;
      --text-dim: #888;
      --accent: #00ff88;
      --accent-2: #7c3aed;
      --glow: 0 0 20px rgba(0, 255, 136, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo span { color: var(--text); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      transition: color 0.2s;
    }

    .nav-link:hover { color: var(--text); }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
    }

    .live-dot.on {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 99px;
    }

    .user-pill {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 14px 4px 4px;
      border-radius: 99px;
      cursor: default;
    }

    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .user-pill span { font-size: 13px; font-weight: 600; }

    .btn-logout {
      background: none;
      border: none;
      color: #f43f5e;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
    }

    .btn-logout:hover { text-decoration: underline; }

    /* AUTH GATE */
    #auth-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      text-align: center;
      padding: 40px;
    }

    .gate-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.2);
      padding: 6px 16px;
      border-radius: 99px;
      margin-bottom: 24px;
    }

    .gate-title {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    .gate-title em {
      font-style: normal;
      color: var(--accent);
    }

    .gate-sub {
      font-size: 16px;
      color: var(--text-dim);
      max-width: 420px;
      line-height: 26px;
      margin-bottom: 40px;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #111;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
    }

    .btn-google svg { width: 20px; height: 20px; }

    /* MAIN STORE */
    #store {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    #store.active { display: grid; grid-template-columns: 1fr 380px; gap: 48px; }

    .col-main h2, .col-side h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 28px;
    }

    .col-main h2 span { color: var(--accent); }

    /* PRODUCT GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(0, 255, 136, 0.3);
      box-shadow: var(--glow);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    .card:hover .card-img { transform: scale(1.06); }

    .card-img-wrap {
      overflow: hidden;
      position: relative;
    }

    .card-cat {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .card-body { padding: 18px; }

    .card-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 19px;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }

    .btn-buy {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-buy:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
    }

    .btn-buy:active { transform: scale(0.96); }

    .btn-buy:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ORDER TRACKER SIDEBAR */
    .col-side {
      position: sticky;
      top: 100px;
      align-self: start;
    }

    .tracker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }

    .tracker-list { display: flex; flex-direction: column; gap: 14px; }

    .tracker-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      animation: slideUp 0.3s ease;
    }

    .tracker-card.flash {
      animation: glow 1.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0% { border-color: var(--accent); box-shadow: 0 0 12px rgba(0, 255, 136, 0.2); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    .tracker-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tracker-id {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: rgba(234, 179, 8, 0.12); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.2); }
    .badge-shipped { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
    .badge-delivered { background: rgba(0, 255, 136, 0.12); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.2); }

    .tracker-product {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 4px;
      background: #222;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #444;
    }

    .progress-labels .active { color: var(--text-dim); }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: #444;
      font-size: 14px;
      font-weight: 500;
    }

    /* TOASTS */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px 18px;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .toast-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .toast-msg { font-size: 13px; color: var(--text-dim); line-height: 18px; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 99px; }

    @media (max-width: 800px) {
      nav { padding: 0 20px; }
      #store.active { grid-template-columns: 1fr; }
      .col-side { position: static; }
      .grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><em>Skibidi</em><span> Shop</span></div>
  <div class="nav-right">
    <div id="user-pill" class="user-pill">
      <img id="user-photo" src="" alt="">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
    <div class="live-badge">
      <span id="ws-dot" class="live-dot"></span>
      <span id="ws-text">Offline</span>
    </div>
  </div>
</nav>

<section id="auth-gate">
  <div class="gate-badge">Real-Time E-Commerce</div>
  <h1 class="gate-title">Welcome to<br><em>Skibidi Shop</em></h1>
  <p class="gate-sub">Sign in with Google to browse premium tech, purchase in one click, and track your orders in real-time with live email notifications.</p>
  <button class="btn-google" onclick="googleLogin()">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 01-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09a6.97 6.97 0 010-4.18V7.07H2.18A11 11 0 001 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84A6.97 6.97 0 0112 5.38z" fill="#EA4335"/></svg>
    Continue with Google
  </button>
</section>

<main id="store">
  <div class="col-main">
    <h2><span>▸</span> Catalog</h2>
    <div id="grid" class="grid"></div>
  </div>
  <div class="col-side">
    <h2>Your Orders</h2>
    <div class="tracker">
      <div id="tracker-list" class="tracker-list">
        <div class="empty">No orders yet — grab something!</div>
      </div>
    </div>
  </div>
</main>

<div id="toasts" class="toast-wrap"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
  let auth;
  let token = null;
  let products = [];
  let orders = [];

  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  async function initStore() {
    const res = await fetch('/api/config');
    const config = await res.json();
    firebase.initializeApp(config);
    
    auth = firebase.auth();

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        token = await user.getIdToken();
        document.getElementById('user-photo').src = user.photoURL || '';
        document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
        document.getElementById('user-pill').style.display = 'flex';
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('store').classList.add('active');
        await syncProfile();
        await loadProducts();
        await loadOrders();
        connectWS();
      } else {
        token = null;
        closeWS();
        document.getElementById('user-pill').style.display = 'none';
        document.getElementById('auth-gate').style.display = 'flex';
        document.getElementById('store').classList.remove('active');
      }
    });
  }

  initStore();

  function googleLogin() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => {
      toast('Error', 'Google sign-in failed. Try again.');
    });
  }

  function logout() { auth.signOut(); }

  async function syncProfile() {
    try {
      await fetch('/api/auth/sync', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    } catch {}
  }

  async function loadProducts() {
    try {
      const res = await fetch('/api/products?limit=48');
      products = (await res.json()).items;
      renderProducts();
    } catch {}
  }

  function renderProducts() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    products.forEach(p => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-img-wrap">
          <span class="card-cat">${esc(p.category)}</span>
          <img class="card-img" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-name">${esc(p.name)}</div>
          <div class="card-desc">${esc(p.description)}</div>
          <div class="card-footer">
            <span class="card-price">$${(p.price_cents / 100).toFixed(2)}</span>
            <button class="btn-buy" id="buy-${p.id}" onclick="buy(${p.id}, this)">Buy Now</button>
          </div>
        </div>
      `;
      grid.appendChild(el);
    });
  }

  async function buy(productId, btn) {
    btn.disabled = true;
    btn.textContent = 'Processing...';
    try {
      const res = await fetch('/api/store/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ product_id: productId })
      });
      if (!res.ok) throw new Error((await res.json()).error);
      const order = await res.json();
      toast('Order Placed!', `${order.product_name} \u2014 check your email for confirmation.`);
    } catch (e) {
      toast('Failed', e.message || 'Could not place order');
    }
    btn.disabled = false;
    btn.textContent = 'Buy Now';
  }

  async function loadOrders() {
    try {
      const res = await fetch('/api/store/my-orders', { headers: { 'Authorization': 'Bearer ' + token } });
      orders = await res.json();
      renderOrders();
    } catch {}
  }

  function progressWidth(s) { return s === 'pending' ? '20%' : s === 'shipped' ? '60%' : '100%'; }

  function renderOrders() {
    const list = document.getElementById('tracker-list');
    if (orders.length === 0) {
      list.innerHTML = '<div class="empty">No orders yet — grab something!</div>';
      return;
    }
    list.innerHTML = '';
    orders.forEach(o => list.appendChild(orderCard(o)));
  }

  function orderCard(o) {
    const div = document.createElement('div');
    div.className = 'tracker-card';
    div.id = 'order-' + o.id;
    const a = (s) => (s === 'pending' || s === 'shipped' || s === 'delivered');
    const aShip = (s) => (s === 'shipped' || s === 'delivered');
    const aDel = (s) => (s === 'delivered');
    div.innerHTML = `
      <div class="tracker-head">
        <span class="tracker-id">#${esc(o.id)}</span>
        <span class="badge badge-${esc(o.status)}">${esc(o.status)}</span>
      </div>
      <div class="tracker-product">${esc(o.product_name)}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressWidth(o.status)}"></div></div>
      <div class="progress-labels">
        <span class="${a(o.status) ? 'active' : ''}">Ordered</span>
        <span class="${aShip(o.status) ? 'active' : ''}">Shipped</span>
        <span class="${aDel(o.status) ? 'active' : ''}">Delivered</span>
      </div>
    `;
    return div;
  }

  // WebSocket — the server only streams orders belonging to the authenticated user.
  const wsDot = document.getElementById('ws-dot');
  const wsText = document.getElementById('ws-text');
  let ws = null;

  function closeWS() {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    wsDot.classList.remove('on');
    wsText.textContent = 'Offline';
  }

  function connectWS() {
    if (!token || ws) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/?token=${encodeURIComponent(token)}`);

    ws.onopen = () => { wsDot.classList.add('on'); wsText.textContent = 'Live'; };
    ws.onclose = () => { ws = null; wsDot.classList.remove('on'); wsText.textContent = 'Offline'; };
    ws.onmessage = onWSMessage;
  }

  function onWSMessage(e) {
    const msg = JSON.parse(e.data);
    if (msg.type !== 'order_change') return;

    if (msg.operation === 'INSERT') {
      orders.unshift(msg.data);
      renderOrders();
      toast('Order Received', msg.data.product_name + ' is being processed!');
    } else if (msg.operation === 'UPDATE') {
      const idx = orders.findIndex(o => o.id === msg.data.id);
      if (idx !== -1) {
        orders[idx] = msg.data;
        renderOrders();
        const card = document.getElementById('order-' + msg.data.id);
        if (card) card.classList.add('flash');
        const icon = msg.data.status === 'delivered' ? '🎉' : '🚚';
        toast('Status Update', icon + ' Order #' + msg.data.id + ' → ' + msg.data.status.toUpperCase());
      }
    } else if (msg.operation === 'DELETE') {
      orders = orders.filter(o => o.id !== msg.data.id);
      renderOrders();
    }
  }

  function toast(title, msg) {
    const wrap = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<div class="toast-title">${esc(title)}</div><div class="toast-msg">${esc(msg)}</div>`;
    wrap.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(40px)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 5000);
  }
</script>
</body>
</html>
