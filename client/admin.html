<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skibidi Shop — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #222;
      padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 20px; font-weight: 800; color: #00ff88; text-transform: uppercase; }
    .logo span { color: #fff; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-link { font-size: 13px; font-weight: 600; color: #888; text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: #fff; }
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #888; background: #111; border: 1px solid #222; padding: 5px 12px; border-radius: 99px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .live-dot.on { background: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.6); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    main {
      flex: 1; max-width: 1000px; width: 100%;
      margin: 40px auto; padding: 0 24px;
      display: grid; grid-template-columns: 2fr 1fr; gap: 32px;
    }

    .panel {
      background: #111; border: 1px solid #222;
      border-radius: 16px; padding: 24px;
    }

    .section-title {
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px;
      color: #888; margin-bottom: 20px;
    }

    .order-list { display: flex; flex-direction: column; gap: 12px; }

    .order-card {
      background: #1a1a1a; border: 1px solid #222;
      border-radius: 12px; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      transition: transform 0.2s, border-color 0.2s;
      animation: fadeIn 0.3s ease;
    }
    .order-card:hover { transform: translateY(-2px); border-color: #333; }
    .order-card.updated { animation: flash 1s ease; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes flash { 0%{border-color:#00ff88;box-shadow:0 0 10px rgba(0,255,136,0.15)} 100%{border-color:#222;box-shadow:none} }

    .order-info { display: flex; flex-direction: column; gap: 3px; }
    .order-id { font-size: 11px; color: #555; font-weight: 700; }
    .customer-name { font-size: 15px; font-weight: 700; }
    .product-name { font-size: 13px; color: #888; }

    .badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
    .badge-pending { background: rgba(234,179,8,0.12); color: #eab308; border: 1px solid rgba(234,179,8,0.2); }
    .badge-shipped { background: rgba(56,189,248,0.12); color: #38bdf8; border: 1px solid rgba(56,189,248,0.2); }
    .badge-delivered { background: rgba(0,255,136,0.12); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); }

    .form-group { margin-bottom: 14px; }
    input, select {
      width: 100%; background: #0a0a0a; border: 1px solid #222;
      color: #fff; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #444; }
    input:focus, select:focus { border-color: #00ff88; }

    button {
      width: 100%; padding: 10px 16px; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }

    .btn-green { background: #00ff88; color: #000; }
    .btn-orange { background: #f59e0b; color: #000; margin-top: 10px; }
    .btn-red { background: #ef4444; color: #fff; margin-top: 10px; }

    .divider { height: 1px; background: #222; margin: 20px 0; }
    .empty { text-align: center; padding: 40px 20px; color: #444; font-size: 14px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 99px; }
  </style>
</head>
<body>

<nav>
  <div class="logo"><em>Skibidi</em><span> Admin</span></div>
  <div class="nav-right">
    <a href="/" class="nav-link">← Back to Store</a>
    <div class="live-badge">
      <span id="ws-dot" class="live-dot"></span>
      <span id="ws-text">Offline</span>
    </div>
  </div>
</nav>

<main id="admin-content" style="display: none;">
  <div class="panel">
    <div class="section-title">All Orders</div>
    <div id="order-list" class="order-list">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">Controls</div>
    <div class="form-group"><input id="inp-name" type="text" placeholder="Customer Name"></div>
    <div class="form-group"><input id="inp-email" type="email" placeholder="Customer Email"></div>
    <div class="form-group"><input id="inp-product" type="text" placeholder="Product Name"></div>
    <button class="btn-green" onclick="createOrder()">Create Order</button>

    <div class="divider"></div>

    <div class="form-group"><input id="inp-id" type="number" placeholder="Order ID"></div>
    <div class="form-group">
      <select id="inp-status">
        <option value="pending">Pending</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
      </select>
    </div>
    <button class="btn-orange" onclick="updateOrder()">Update Status</button>
    <button class="btn-red" onclick="deleteOrder()">Delete Order</button>

    <p id="controls-status" style="margin-top: 14px; font-size: 13px; font-weight: 600; display: none;"></p>
  </div>
</main>

<section id="admin-gate" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center;">
  <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 16px;">Admin Access Required</h1>
  <p style="color: #888; margin-bottom: 24px;">Please sign in with the verified Skibidi Shop owner account.</p>
  <button class="btn-green" style="max-width: 250px; padding: 14px; font-size: 15px;" onclick="googleLogin()">Admin Login via Google</button>
  <p id="auth-error" style="color: #ef4444; margin-top: 16px; font-size: 14px; font-weight: 700; display: none;"></p>
</section>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
  let auth;
  const ADMIN_EMAIL = 'skibidi.businessguru@gmail.com';

  const statusEl = document.getElementById('controls-status');

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.style.color = isError ? '#ef4444' : '#00ff88';
    statusEl.style.display = 'block';
  }

  async function requestJSON(url, options) {
    const res = await fetch(url, options);
    const text = await res.text();
    let body = null;
    if (text) {
      try { body = JSON.parse(text); } catch { body = null; }
    }
    if (!res.ok) {
      throw new Error((body && body.error) || `${url} failed with status ${res.status}`);
    }
    return body;
  }

  async function initAdmin() {
    const config = await requestJSON('/api/config');
    firebase.initializeApp(config);
    
    auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
      if (user) {
        if (user.email === ADMIN_EMAIL) {
          document.getElementById('admin-gate').style.display = 'none';
          document.getElementById('admin-content').style.display = 'grid';
          load();
        } else {
          document.getElementById('auth-error').textContent = 'Access Denied: You are not the Skibidi Shop admin.';
          document.getElementById('auth-error').style.display = 'block';
          auth.signOut();
        }
      } else {
        document.getElementById('admin-gate').style.display = 'flex';
        document.getElementById('admin-content').style.display = 'none';
      }
    });
  }

  initAdmin().catch((e) => {
    console.error('Admin initialization failed:', e);
    const error = document.getElementById('auth-error');
    error.textContent = 'The admin dashboard could not be initialized. Please reload the page.';
    error.style.display = 'block';
  });

  function googleLogin() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => {
      console.error('Admin sign-in failed:', e);
      const error = document.getElementById('auth-error');
      error.textContent = 'Google sign-in failed. Please try again.';
      error.style.display = 'block';
    });
  }

  let orders = [];
  const list = document.getElementById('order-list');

  async function load() {
    try {
      orders = await requestJSON('/api/orders');
      render();
    } catch (e) {
      console.error('Order load failed:', e);
      list.innerHTML = '<div class="empty">Failed to load orders. Please reload.</div>';
    }
  }

  function render() {
    if (!orders.length) { list.innerHTML = '<div class="empty">No orders</div>'; return; }
    list.innerHTML = '';
    orders.forEach(o => {
      const el = document.createElement('div');
      el.className = 'order-card';
      el.id = 'order-' + o.id;
      el.innerHTML = `
        <div class="order-info">
          <span class="order-id">#${o.id} ${o.customer_email ? '· ' + o.customer_email : ''}</span>
          <span class="customer-name">${o.customer_name}</span>
          <span class="product-name">${o.product_name}</span>
        </div>
        <span class="badge badge-${o.status}">${o.status}</span>
      `;
      list.appendChild(el);
    });
  }

  async function createOrder() {
    const name = document.getElementById('inp-name').value;
    const email = document.getElementById('inp-email').value || null;
    const product = document.getElementById('inp-product').value;
    if (!name || !product) {
      showStatus('Customer name and product name are required.', true);
      return;
    }

    try {
      const order = await requestJSON('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_name: name, customer_email: email, product_name: product })
      });
      showStatus(`Order #${order.id} created.`, false);
    } catch (e) {
      console.error('Order creation failed:', e);
      showStatus(e.message, true);
      return;
    }

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-email').value = '';
    document.getElementById('inp-product').value = '';
  }

  async function updateOrder() {
    const id = document.getElementById('inp-id').value;
    const status = document.getElementById('inp-status').value;
    if (!id) {
      showStatus('An order ID is required.', true);
      return;
    }

    try {
      await requestJSON('/api/orders/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      showStatus(`Order #${id} set to ${status}.`, false);
    } catch (e) {
      console.error('Order status update failed:', e);
      showStatus(e.message, true);
      return;
    }

    document.getElementById('inp-id').value = '';
  }

  async function deleteOrder() {
    const id = document.getElementById('inp-id').value;
    if (!id) {
      showStatus('An order ID is required.', true);
      return;
    }

    try {
      await requestJSON('/api/orders/' + id, { method: 'DELETE' });
      showStatus(`Order #${id} deleted.`, false);
    } catch (e) {
      console.error('Order deletion failed:', e);
      showStatus(e.message, true);
      return;
    }

    document.getElementById('inp-id').value = '';
  }

  const dot = document.getElementById('ws-dot');
  const txt = document.getElementById('ws-text');
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host);

  ws.onopen = () => { dot.classList.add('on'); txt.textContent = 'Live'; };
  ws.onclose = () => { dot.classList.remove('on'); txt.textContent = 'Offline'; };

  ws.onerror = (e) => { console.error('WebSocket error:', e); };

  ws.onmessage = (e) => {
    let msg;
    try {
      msg = JSON.parse(e.data);
    } catch (err) {
      console.error('Ignoring malformed WebSocket message:', e.data, err);
      return;
    }
    if (msg.type !== 'order_change') return;

    if (msg.operation === 'INSERT') {
      orders.unshift(msg.data);
      render();
    } else if (msg.operation === 'UPDATE') {
      const idx = orders.findIndex(o => o.id === msg.data.id);
      if (idx !== -1) { orders[idx] = msg.data; render(); }
      const card = document.getElementById('order-' + msg.data.id);
      if (card) card.classList.add('updated');
    } else if (msg.operation === 'DELETE') {
      orders = orders.filter(o => o.id !== msg.data.id);
      render();
    }
  };

  load();
</script>
</body>
</html>
