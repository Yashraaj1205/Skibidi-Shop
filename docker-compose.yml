version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apt_orders_db
    environment:
      POSTGRES_DB: ${DB_NAME:-apt_orders}
      POSTGRES_USER: ${DB_USER:-apt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apt_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
